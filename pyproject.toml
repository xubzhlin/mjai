[project]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "tensorboard>=2.14",
    "tqdm>=4.65",
    "tomli>=2.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project.scripts]
mjai-train = "mjai.train:main"
mjai-eval = "mjai.eval:main"
mjai-replay = "mjai.replay:main"