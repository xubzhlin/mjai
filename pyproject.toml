[project]
name = "mjai"
version = "0.1.0"
description = "Sichuan Mahjong Self-Play RL (XueZhanDaoDi)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "tensorboard>=2.14",
    "tqdm>=4.65",
    "tomli>=2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mjai*"]

[project.scripts]
mjai-train = "mjai.train:main"
mjai-eval = "mjai.eval:main"
mjai-replay = "mjai.replay:main"
