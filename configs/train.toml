# 训练超参数配置

# 训练参数
[train]
total_episodes = 100000
batch_size = 256
learning_rate = 0.0001
gamma = 0.99
target_update_freq = 100
gradient_clip_norm = 1.0
device = "cuda" if cuda else "cpu"

# 经验回放缓冲区
[buffer]
capacity = 100000
sample_priority = "uniform"  # uniform or PER
per_alpha = 0.6
per_beta = 0.4

# 对手池配置
[opponent_pool]
capacity = 20
snapshot_interval = 500
eval_games = 100
admission_win_rate = 0.3
retire_win_rate = 0.1
sampling_strategy = "uniform"  # uniform or adversarial

# 模型保存
[save]
snapshot_interval = 1000
save_dir = "checkpoints"
best_model_metric = "win_rate"

# 评估配置
[eval]
eval_interval = 100
eval_games = 500
baseline_opponents = ["random", "heuristic"]
metrics = ["win_rate", "avg_fan", "pon_rate", "kong_rate", "hu_rate"]

# 损失权重
[loss_weights]
dqn = 1.0
grp = 0.1
entropy = 0.01